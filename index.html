<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบเวลาเข้า-ออกงานและเพิ่มรายชื่อบุคลากรอัตโนมัติ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel handling -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-800 pb-5">
            <div>
                <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                    ⏱️ ระบบตรวจสอบเวลาเข้า-ออกงาน
                </h1>
                <p class="text-gray-400 text-sm mt-1">จัดการข้อมูลการสแกนนิ้ว คำนวณเวลาเข้า-ออก และอัปเดตทะเบียนบุคลากรอัตโนมัติ</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-3">
                <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-all shadow-lg flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    นำเข้าไฟล์ Excel/CSV
                    <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFileUpload(event)">
                </label>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-all shadow-lg flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    ส่งออกรายงาน Excel
                </button>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-8">
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
                <div class="text-gray-400 text-xs font-medium">บุคลากรทั้งหมด</div>
                <div class="text-2xl font-bold text-white mt-1" id="statTotal">0</div>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
                <div class="text-emerald-400 text-xs font-medium">มาทันเวลา</div>
                <div class="text-2xl font-bold text-emerald-400 mt-1" id="statOnTime">0</div>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
                <div class="text-amber-400 text-xs font-medium">มาสาย</div>
                <div class="text-2xl font-bold text-amber-400 mt-1" id="statLate">0</div>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
                <div class="text-rose-400 text-xs font-medium">ขาดสแกน</div>
                <div class="text-2xl font-bold text-rose-400 mt-1" id="statAbsent">0</div>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
                <div class="text-blue-400 text-xs font-medium">สแกนซ้ำ</div>
                <div class="text-2xl font-bold text-blue-400 mt-1" id="statDuplicate">0</div>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
                <div class="text-purple-400 text-xs font-medium">ลา / อื่นๆ</div>
                <div class="text-2xl font-bold text-purple-400 mt-1" id="statLeave">0</div>
            </div>
        </div>

        <!-- Toolbar & Filter Controls -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-3 items-center">
                <!-- ค้นหาตามชื่อ/รหัส -->
                <input type="text" id="searchInput" onkeyup="filterData()" placeholder="🔍 ค้นหาชื่อ หรือ รหัส..." class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 w-48 md:w-60">
                
                <!-- ตัวเลือกกรองสังกัด -->
                <select id="deptFilter" onchange="filterData()" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="">ทุกหน่วยงาน / กอง</option>
                </select>

                <!-- เพิ่มระบบค้นหาช่วงเวลา -->
                <div class="flex items-center gap-2 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5">
                    <span class="text-gray-400 text-xs">🕒 ช่วงเวลา:</span>
                    <input type="time" id="startTime" class="bg-transparent text-white text-sm focus:outline-none">
                    <span class="text-gray-500 text-xs">ถึง</span>
                    <input type="time" id="endTime" class="bg-transparent text-white text-sm focus:outline-none">
                    <button onclick="filterData()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-2.5 py-1 rounded transition-all">กรองเวลา</button>
                    <button onclick="clearTimeFilter()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 text-xs px-2 py-1 rounded transition-all">ล้าง</button>
                </div>
            </div>

            <!-- แถบปุ่มสั่งพิมพ์เฉพาะกลุ่ม -->
            <div class="flex gap-2">
                <button onclick="printFilteredData('present')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-sm font-medium transition-all shadow flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    พิมพ์เฉพาะคนมา
                </button>
                <button onclick="printFilteredData('absent')" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2 rounded-lg text-sm font-medium transition-all shadow flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    พิมพ์เฉพาะคนขาดสแกน
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-gray-900/80 text-gray-400 uppercase text-xs font-semibold border-b border-gray-700">
                        <tr>
                            <th class="px-6 py-4 text-center">ลำดับ</th>
                            <th class="px-6 py-4">รหัสประจำตัว</th>
                            <th class="px-6 py-4">ชื่อ-นามสกุล</th>
                            <th class="px-6 py-4">สังกัด / กอง</th>
                            <th class="px-6 py-4 text-center">เวลาเข้า</th>
                            <th class="px-6 py-4 text-center">เวลาออก</th>
                            <th class="px-6 py-4 text-center">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-700/50">
                        <!-- Data Rows inserted via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript Execution Logic -->
    <script>
        // ข้อมูลจำลองตั้งต้น (Mock Data)
        const INITIAL_ROSTER = [
            { id: "1001", name: "นายสมชาย ใจดี", dept: "กองช่าง" },
            { id: "1002", name: "นางสาวสมหญิง รักดี", dept: "กองการศึกษา" },
            { id: "1003", name: "นายวิชัย ขยันยิ่ง", dept: "สำนักปลัด" },
            { id: "1004", name: "นางสาวมณี มีสุข", dept: "กองคลัง" },
            { id: "1005", name: "นายกฤษณะ รุ่งเรือง", dept: "กองช่าง" }
        ];

        let processedData = [
            { empId: "1001", name: "นายสมชาย ใจดี", department: "กองช่าง", checkIn: "08:15", checkOut: "16:30", status: "ปกติ" },
            { empId: "1002", name: "นางสาวสมหญิง รักดี", department: "กองการศึกษา", checkIn: "08:45", checkOut: "16:35", status: "สาย" },
            { empId: "1003", name: "นายวิชัย ขยันยิ่ง", department: "สำนักปลัด", checkIn: "", checkOut: "", status: "ขาดสแกน" },
            { empId: "1004", name: "นางสาวมณี มีสุข", department: "กองคลัง", checkIn: "08:05", checkOut: "16:40", status: "ปกติ" },
            { empId: "1005", name: "นายกฤษณะ รุ่งเรือง", department: "กองช่าง", checkIn: "", checkOut: "", status: "ขาดสแกน" }
        ];

        let displayData = [...processedData];

        // 1. แสดงผลตารางหลัก
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500">ไม่พบข้อมูลตามเงื่อนไขที่เลือก</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                let badgeClass = 'bg-gray-700 text-gray-300';
                if (item.status === 'ปกติ') badgeClass = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                else if (item.status === 'สาย') badgeClass = 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
                else if (item.status === 'ขาดสแกน') badgeClass = 'bg-rose-500/10 text-rose-400 border border-rose-500/20';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/60 transition-colors">
                        <td class="px-6 py-4 text-center text-gray-500 font-mono text-xs">${index + 1}</td>
                        <td class="px-6 py-4 font-mono text-xs text-gray-400">${item.empId}</td>
                        <td class="px-6 py-4 font-medium text-white">${item.name}</td>
                        <td class="px-6 py-4 text-gray-400">${item.department}</td>
                        <td class="px-6 py-4 text-center font-mono ${item.checkIn ? 'text-emerald-400' : 'text-gray-600'}">${item.checkIn || '-'}</td>
                        <td class="px-6 py-4 text-center font-mono ${item.checkOut ? 'text-blue-400' : 'text-gray-600'}">${item.checkOut || '-'}</td>
                        <td class="px-6 py-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                                ${item.status}
                            </span>
                        </td>
                    </tr>
                `;
            });
            updateStats(data);
        }

        // 2. คำนวณ KPI สรุปผล
        function updateStats(data) {
            document.getElementById('statTotal').innerText = data.length;
            document.getElementById('statOnTime').innerText = data.filter(i => i.status === 'ปกติ').length;
            document.getElementById('statLate').innerText = data.filter(i => i.status === 'สาย').length;
            document.getElementById('statAbsent').innerText = data.filter(i => i.status === 'ขาดสแกน').length;
        }

        // 3. ฟังก์ชันค้นหาและกรองข้อมูล (รวม กรองชื่อ, สังกัด และ ช่วงเวลาเข้างาน)
        function filterData() {
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedDept = document.getElementById('deptFilter').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            displayData = processedData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchKeyword) || item.empId.includes(searchKeyword);
                const matchesDept = !selectedDept || item.department === selectedDept;
                
                let matchesTime = true;
                if (startTime && endTime && item.checkIn) {
                    matchesTime = item.checkIn >= startTime && item.checkIn <= endTime;
                } else if (startTime && endTime && !item.checkIn) {
                    matchesTime = false;
                }

                return matchesSearch && matchesDept && matchesTime;
            });

            renderTable(displayData);
        }

        // 4. ล้างการกรองเวลา
        function clearTimeFilter() {
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            filterData();
        }

        // 5. ฟังก์ชันสร้างและเปิดหน้าต่างพิมพ์รายงาน (Print Filtered Data)
        function printFilteredData(statusType) {
            let filteredList = [];
            let reportTitle = '';

            if (statusType === 'present') {
                reportTitle = 'รายงานบุคลากรที่มาปฏิบัติงาน (ปกติ / สาย)';
                filteredList = displayData.filter(item => item.status === 'ปกติ' || item.status === 'สาย');
            } else if (statusType === 'absent') {
                reportTitle = 'รายงานบุคลากรที่ไม่พบข้อมูลสแกนเข้า-ออกงาน (ขาดสแกน)';
                filteredList = displayData.filter(item => item.status === 'ขาดสแกน');
            }

            if (filteredList.length === 0) {
                alert('ไม่พบรายการข้อมูลตามเงื่อนไขที่เลือกพิมพ์');
                return;
            }

            const printWin = window.open('', '_blank');
            const tableRows = filteredList.map((item, idx) => `
                <tr>
                    <td style="text-align: center;">${idx + 1}</td>
                    <td style="text-align: center;">${item.empId}</td>
                    <td>${item.name}</td>
                    <td>${item.department}</td>
                    <td style="text-align: center;">${item.checkIn || '-'}</td>
                    <td style="text-align: center;">${item.checkOut || '-'}</td>
                    <td style="text-align: center;">${item.status}</td>
                </tr>
            `).join('');

            printWin.document.write(`
                <!DOCTYPE html>
                <html lang="th">
                <head>
                    <meta charset="UTF-8">
                    <title>${reportTitle}</title>
                    <style>
                        body { font-family: 'Sarabun', sans-serif; padding: 20px; color: #111; }
                        h2 { text-align: center; margin-bottom: 5px; }
                        p { text-align: center; color: #666; font-size: 13px; margin-top: 0; }
                        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                        th, td { border: 1px solid #666; padding: 8px; font-size: 13px; }
                        th { background-color: #f2f2f2; }
                        @media print { @page { size: A4 portrait; margin: 10mm; } }
                    </style>
                </head>
                <body>
                    <h2>${reportTitle}</h2>
                    <p>ข้อมูล ณ วันที่: ${new Date().toLocaleDateString('th-TH')}</p>
                    <table>
                        <thead>
                            <tr>
                                <th>ลำดับ</th>
                                <th>รหัสประจำตัว</th>
                                <th>ชื่อ-นามสกุล</th>
                                <th>สังกัด / กอง</th>
                                <th>เวลาเข้า</th>
                                <th>เวลาออก</th>
                                <th>สถานะ</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </body>
                </html>
            `);

            printWin.document.close();
            printWin.focus();
            setTimeout(() => {
                printWin.print();
                printWin.close();
            }, 300);
        }

        // เริ่มต้นโหลดข้อมูลแสดงผลในตาราง
        document.addEventListener('DOMContentLoaded', () => {
            renderTable(displayData);
        });
    </script>
</body>
</html>
