<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบเช็คเวลาสแกนนิ้ว & จัดการรายชื่อบุคลากร</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .table-sticky th { position: sticky; top: 0; z-index: 10; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 max-w-7xl mx-auto space-y-4">

  <!-- Header & Import Controls -->
  <header class="bg-[#1B365D] text-white p-5 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h1 class="text-xl font-bold">ระบบตรวจสอบเวลาสแกนนิ้ว & จัดการทะเบียนบุคลากร</h1>
      <p class="text-xs text-blue-200 mt-1">💾 บันทึกข้อมูลประวัติสแกนแยกวันลงเครื่องอัตโนมัติ + ลบ/เพิ่มรายชื่อได้ตลอดเวลา</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden" />
      <button onclick="document.getElementById('fileInput').click()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-sm px-4 py-2.5 rounded-xl shadow transition">
        📂 นำเข้าไฟล์สแกนนิ้ว (เพิ่มสะสมตามวัน)
      </button>
      <button onclick="exportExcel()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-sm px-4 py-2.5 rounded-xl shadow transition">
        📊 ส่งออก Excel
      </button>
    </div>
  </header>

  <!-- Status Notification -->
  <div id="toast" class="hidden p-3 rounded-xl text-sm font-medium border"></div>

  <!-- Control Bar: Select Date & Filters -->
  <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">📅 เลือกวันที่ต้องการดูข้อมูล</label>
      <select id="datePicker" onchange="renderAll()" class="w-full bg-amber-50 border-2 border-[#1B365D] rounded-lg p-2 text-sm font-bold text-[#1B365D]"></select>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">🔍 ค้นหาชื่อ/ตำแหน่ง</label>
      <input type="text" id="searchInput" oninput="renderAll()" placeholder="พิมพ์ชื่อเพื่อค้นหา..." class="w-full border border-slate-300 rounded-lg p-2 text-sm" />
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">⏰ เกณฑ์เข้างานเช้า (สายถ้าเกิน)</label>
      <input type="time" id="lateTime" value="08:30" onchange="renderAll()" class="w-full border border-slate-300 rounded-lg p-2 text-sm" />
    </div>
    <div class="flex gap-2">
      <button onclick="clearAllData()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 font-semibold text-xs py-2.5 rounded-lg transition">
        ↺ ล้างข้อมูลทั้งหมด
      </button>
    </div>
  </section>

  <!-- Main Tabs -->
  <div class="flex border-b border-slate-300 space-x-2">
    <button id="tab1Btn" onclick="switchTab(1)" class="py-2 px-4 font-bold text-sm border-b-2 border-[#1B365D] text-[#1B365D]">
      📋 สรุปเวลาเข้า-ออกงานประจำวัน (<span id="countDaily">0</span> คน)
    </button>
    <button id="tab2Btn" onclick="switchTab(2)" class="py-2 px-4 font-semibold text-sm text-slate-500">
      👥 จัดการทะเบียนรายชื่อบุคลากร (ลบ/เพิ่มคน) (<span id="countRoster">0</span> คน)
    </button>
  </div>

  <!-- TAB 1: Daily Summary Table -->
  <div id="tab1" class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
    <div class="overflow-x-auto max-h-[550px]">
      <table class="w-full text-xs text-left border-collapse">
        <thead class="bg-[#1B365D] text-white table-sticky">
          <tr>
            <th class="p-3 text-center">#</th>
            <th class="p-3">สังกัด / กอง</th>
            <th class="p-3">ชื่อ-นามสกุล</th>
            <th class="p-3">ตำแหน่ง</th>
            <th class="p-3 text-center">เวลาเข้า (เช้า)</th>
            <th class="p-3 text-center">สถานะเช้า</th>
            <th class="p-3 text-center">เวลาออก (เย็น)</th>
            <th class="p-3 text-center">สถานะเย็น</th>
            <th class="p-3 text-center">สรุปผล</th>
          </tr>
        </thead>
        <tbody id="dailyTbody" class="divide-y divide-slate-200"></tbody>
      </table>
    </div>
  </div>

  <!-- TAB 2: Manage Roster & Delete People -->
  <div id="tab2" class="hidden space-y-4">
    <!-- Add Person Box -->
    <div class="bg-purple-50 p-4 rounded-xl border border-purple-200 flex flex-col md:flex-row gap-2 items-end">
      <div class="flex-1">
        <label class="block text-xs font-bold text-purple-900 mb-1">ชื่อ-นามสกุล</label>
        <input type="text" id="addName" placeholder="เช่น นายสมชาย ใจดี" class="w-full border border-purple-300 rounded-lg p-2 text-xs" />
      </div>
      <div>
        <label class="block text-xs font-bold text-purple-900 mb-1">สังกัด/กอง</label>
        <input type="text" id="addDept" placeholder="เช่น สำนักปลัด" class="w-full border border-purple-300 rounded-lg p-2 text-xs" />
      </div>
      <div>
        <label class="block text-xs font-bold text-purple-900 mb-1">ตำแหน่ง</label>
        <input type="text" id="addPos" placeholder="เช่น พนักงานจ้าง" class="w-full border border-purple-300 rounded-lg p-2 text-xs" />
      </div>
      <button onclick="addPerson()" class="bg-purple-700 hover:bg-purple-800 text-white font-bold text-xs px-4 py-2.5 rounded-lg transition">
        + เพิ่มชื่อเข้าทะเบียน
      </button>
    </div>

    <!-- Roster List with Delete Button -->
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
      <div class="overflow-x-auto max-h-[500px]">
        <table class="w-full text-xs text-left border-collapse">
          <thead class="bg-slate-800 text-white table-sticky">
            <tr>
              <th class="p-3 text-center">#</th>
              <th class="p-3">ชื่อ-นามสกุล</th>
              <th class="p-3">สังกัด/กอง</th>
              <th class="p-3">ตำแหน่ง</th>
              <th class="p-3 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="rosterTbody" class="divide-y divide-slate-200"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // --------------------------------------------------------
    // STORAGE & INITIAL STATE
    // --------------------------------------------------------
    const DEFAULT_ROSTER = [
      { id: 1, fullname: "พันจ่าเอกสยาม แพทยารักษ์", dept: "ผู้บริหารท้องถิ่น", pos: "ปลัดเทศบาล" },
      { id: 2, fullname: "นางสาวกันตา ธวาบุญรัศมี", dept: "สำนักปลัดเทศบาล", pos: "หัวหน้าสำนักปลัด" },
      { id: 3, fullname: "นางสาวต้นกัญญา รัตนาวดี", dept: "สำนักปลัดเทศบาล", pos: "นักทรัพยากรบุคคล" },
      { id: 4, fullname: "นางพิชาวีร์ เอมดวง", dept: "กองคลัง", pos: "เจ้าพนักงานจัดเก็บรายได้" },
      { id: 5, fullname: "นายพิชญุตม์ เสริมพงษ์", dept: "กองช่าง", pos: "ผู้อำนวยการกองช่าง" }
    ];

    let roster = JSON.parse(localStorage.getItem('app_roster')) || DEFAULT_ROSTER;
    let scans = JSON.parse(localStorage.getItem('app_scans')) || [];

    // Save helpers
    function saveData() {
      localStorage.setItem('app_roster', JSON.stringify(roster));
      localStorage.setItem('app_scans', JSON.stringify(scans));
    }

    // --------------------------------------------------------
    // EVENT LISTENERS & INITIALIZATION
    // --------------------------------------------------------
    document.getElementById('fileInput').addEventListener('change', handleFileUpload);
    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
    });

    function showToast(text, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.className = `p-3 rounded-xl text-sm font-medium border ${isError ? 'bg-rose-50 border-rose-300 text-rose-800' : 'bg-emerald-50 border-emerald-300 text-emerald-800'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    // --------------------------------------------------------
    // MAIN RENDER CONTROLLER
    // --------------------------------------------------------
    function renderAll() {
      updateDatePicker();
      renderDailyTable();
      renderRosterTable();
      saveData();
    }

    function updateDatePicker() {
      const datePicker = document.getElementById('datePicker');
      const currentSel = datePicker.value;
      const dates = Array.from(new Set(scans.map(s => s.date))).sort().reverse();
      
      datePicker.innerHTML = '';
      if (dates.length === 0) {
        datePicker.innerHTML = '<option value="">-- ยังไม่มีข้อมูลไฟล์สแกน --</option>';
        return;
      }

      dates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = `📅 วันที่ ${d} (${scans.filter(s => s.date === d).length} รายการ)`;
        datePicker.appendChild(opt);
      });

      if (currentSel && dates.includes(currentSel)) {
        datePicker.value = currentSel;
      }
    }

    // --------------------------------------------------------
    // TAB 1: DAILY SCAN SUMMARY
    // --------------------------------------------------------
    function renderDailyTable() {
      const selectedDate = document.getElementById('datePicker').value;
      const lateTime = document.getElementById('lateTime').value || "08:30";
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const tbody = document.getElementById('dailyTbody');

      document.getElementById('countDaily').textContent = roster.length;

      if (!selectedDate) {
        tbody.innerHTML = '<tr><td colspan="9" class="p-8 text-center text-slate-400">ยังไม่มีข้อมูล กรุณากดนำเข้าไฟล์สแกนนิ้ว (.xlsx / .csv)</td></tr>';
        return;
      }

      // Filter scans for selected date
      const dayScans = scans.filter(s => s.date === selectedDate);

      let html = '';
      roster.forEach((emp, index) => {
        if (search && !emp.fullname.toLowerCase().includes(search) && !emp.pos.toLowerCase().includes(search)) {
          return;
        }

        // Find employee scans
        const empScans = dayScans.filter(s => cleanName(s.name) === cleanName(emp.fullname));
        const times = empScans.map(s => s.time).sort();

        const morning = times.find(t => t < "12:00") || '';
        const evening = times.filter(t => t >= "12:00").pop() || '';

        let inStatus = '-';
        if (morning) inStatus = morning <= lateTime ? 'ปกติ' : 'มาสาย';

        let outStatus = '-';
        if (evening) outStatus = evening >= '16:30' ? 'ปกติ' : 'ออกก่อนเวลา';

        let summary = 'ขาดสแกน';
        if (morning && evening) summary = inStatus === 'มาสาย' ? 'มาสาย' : 'ปกติ';
        else if (morning) summary = inStatus === 'มาสาย' ? 'มาสาย (ไม่สแกนออก)' : 'สแกนเข้าอย่างเดียว';
        else if (evening) summary = 'สแกนออกอย่างเดียว';

        const inClass = inStatus === 'มาสาย' ? 'bg-amber-100 text-amber-900 font-bold' : (inStatus === 'ปกติ' ? 'bg-emerald-100 text-emerald-800' : 'text-slate-400');
        const outClass = outStatus === 'ออกก่อนเวลา' ? 'bg-amber-100 text-amber-900 font-bold' : (outStatus === 'ปกติ' ? 'bg-blue-100 text-blue-800' : 'text-slate-400');

        html += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 text-center text-slate-400 font-mono">${index + 1}</td>
            <td class="p-3 text-slate-600">${emp.dept}</td>
            <td class="p-3 font-semibold text-slate-900">${emp.fullname}</td>
            <td class="p-3 text-slate-600">${emp.pos}</td>
            <td class="p-3 text-center font-mono font-bold text-slate-800">${morning || '-'}</td>
            <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-[11px] ${inClass}">${inStatus}</span></td>
            <td class="p-3 text-center font-mono font-bold text-slate-800">${evening || '-'}</td>
            <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-[11px] ${outClass}">${outStatus}</span></td>
            <td class="p-3 text-center font-semibold text-slate-700">${summary}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html || '<tr><td colspan="9" class="p-6 text-center text-slate-400">ไม่พบข้อมูลที่ค้นหา</td></tr>';
    }

    // --------------------------------------------------------
    // TAB 2: ROSTER & DELETE PERSON
    // --------------------------------------------------------
    function renderRosterTable() {
      const tbody = document.getElementById('rosterTbody');
      document.getElementById('countRoster').textContent = roster.length;

      let html = '';
      roster.forEach((emp, index) => {
        html += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 text-center text-slate-400 font-mono">${index + 1}</td>
            <td class="p-3 font-semibold text-slate-900">${emp.fullname}</td>
            <td class="p-3 text-slate-600">${emp.dept}</td>
            <td class="p-3 text-slate-600">${emp.pos}</td>
            <td class="p-3 text-center">
              <button onclick="deletePerson(${emp.id})" class="bg-rose-100 hover:bg-rose-600 hover:text-white text-rose-700 font-semibold px-2.5 py-1 rounded-lg text-xs transition">
                🗑️ ลบออก
              </button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html || '<tr><td colspan="5" class="p-6 text-center text-slate-400">ไม่มีรายชื่อในระบบ</td></tr>';
    }

    function addPerson() {
      const name = document.getElementById('addName').value.trim();
      const dept = document.getElementById('addDept').value.trim() || 'ไม่ระบุสังกัด';
      const pos = document.getElementById('addPos').value.trim() || 'พนักงาน';

      if (!name) {
        showToast('กรุณากรอกชื่อ-นามสกุล', true);
        return;
      }

      const newPerson = {
        id: Date.now(),
        fullname: name,
        dept: dept,
        pos: pos
      };

      roster.push(newPerson);
      document.getElementById('addName').value = '';
      showToast(`เพิ่มคุณ "${name}" เข้าทะเบียนเรียบร้อย`);
      renderAll();
    }

    // Delete Person Function
    function deletePerson(id) {
      const target = roster.find(r => r.id === id);
      if (!target) return;

      if (confirm(`คุณต้องการลบคุณ "${target.fullname}" ออกจากทะเบียนใช่หรือไม่?`)) {
        roster = roster.filter(r => r.id !== id);
        showToast(`ลบคุณ "${target.fullname}" เรียบร้อยแล้ว`);
        renderAll();
      }
    }

    // --------------------------------------------------------
    // FILE IMPORT & DATA PERSISTENCE
    // --------------------------------------------------------
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const workbook = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });

          let addedCount = 0;
          let newPersonAdded = 0;

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 2) continue;

            let name = String(row[1] || row[0]).trim();
            let dtStr = String(row[2] || row[1]).trim();

            if (!name || !dtStr) continue;

            // Fix Buddhist year & format
            dtStr = dtStr.replace('/2569', '/2026').replace('-2569', '-2026');
            let [d, t] = dtStr.split(' ');
            if (d && d.includes('/')) {
              const parts = d.split('/');
              if (parts.length === 3) d = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
            }

            if (!d || !t) continue;

            // Auto add new person to roster if missing
            if (!roster.some(r => cleanName(r.fullname) === cleanName(name))) {
              roster.push({
                id: Date.now() + Math.random(),
                fullname: name,
                dept: 'เพิ่มให้อัตโนมัติ',
                pos: 'พนักงาน'
              });
              newPersonAdded++;
            }

            // Append scan record
            scans.push({ date: d, time: t.substring(0,5), name: name });
            addedCount++;
          }

          renderAll();
          showToast(`นำเข้าสำเร็จ ${addedCount} รายการ ${newPersonAdded > 0 ? `(พบคนใหม่เพิ่มเข้าทะเบียน ${newPersonAdded} คน)` : ''}`);

        } catch (err) {
          showToast('เกิดข้อผิดพลาดในการอ่านไฟล์', true);
        }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = '';
    }

    function cleanName(str) {
      if (!str) return '';
      return String(str).replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/, '').replace(/\s+/g, '').trim();
    }

    function switchTab(tabIndex) {
      const t1 = document.getElementById('tab1');
      const t2 = document.getElementById('tab2');
      const b1 = document.getElementById('tab1Btn');
      const b2 = document.getElementById('tab2Btn');

      if (tabIndex === 1) {
        t1.classList.remove('hidden');
        t2.classList.add('hidden');
        b1.className = 'py-2 px-4 font-bold text-sm border-b-2 border-[#1B365D] text-[#1B365D]';
        b2.className = 'py-2 px-4 font-semibold text-sm text-slate-500';
      } else {
        t1.classList.add('hidden');
        t2.classList.remove('hidden');
        b2.className = 'py-2 px-4 font-bold text-sm border-b-2 border-[#1B365D] text-[#1B365D]';
        b1.className = 'py-2 px-4 font-semibold text-sm text-slate-500';
      }
    }

    function clearAllData() {
      if (confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างข้อมูลประวัติไฟล์สแกนทั้งหมด?')) {
        scans = [];
        localStorage.removeItem('app_scans');
        renderAll();
        showToast('ล้างข้อมูลเรียบร้อยแล้ว');
      }
    }

    function exportExcel() {
      const selectedDate = document.getElementById('datePicker').value;
      if (!selectedDate) return showToast('ไม่มีข้อมูลสำหรับส่งออก', true);

      const dayScans = scans.filter(s => s.date === selectedDate);
      const rows = roster.map((r, i) => {
        const empScans = dayScans.filter(s => cleanName(s.name) === cleanName(r.fullname)).map(s => s.time).sort();
        const morning = empScans.find(t => t < "12:00") || '-';
        const evening = empScans.filter(t => t >= "12:00").pop() || '-';
        return {
          "ลำดับ": i + 1,
          "ชื่อ-นามสกุล": r.fullname,
          "สังกัด": r.dept,
          "ตำแหน่ง": r.pos,
          "เข้าเช้า": morning,
          "ออกเย็น": evening
        };
      });

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "สรุปผล");
      XLSX.writeFile(wb, `รายงานสแกนนิ้ว_${selectedDate}.xlsx`);
    }
  </script>
</body>
</html>
